seed: 0

lgbm:
  n_estimators: 3000
  learning_rate: 0.03
  num_leaves: 64
  min_child_samples: 100
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.5
  reg_lambda: 1.0
  early_stopping_rounds: 100

scale_pos_weight_variant: 5.0

tune:
  n_trials: 30
  timeout_minutes: 45
  learning_rate: 0.05

explain:
  shap_sample: 20000

backtest:
  window_days: 30
  min_train_windows: 2
