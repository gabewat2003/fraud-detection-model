name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FRAUD_MLFLOW: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic data; the Kaggle data is never needed in CI)
        run: pytest
      - name: Full pipeline on synthetic data
        run: |
          python -m fraud.cli synth
          python -m fraud.cli all --profile sample --n-trials 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      FRAUD_MLFLOW: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Train the synthetic-sample model
        run: |
          pip install -r requirements.txt && pip install -e . --no-deps
          python -m fraud.cli synth
          python -m fraud.cli all --profile sample --skip-tune
      - name: Build and smoke-test the scoring image
        run: |
          docker build --build-arg MODELS_DIR=models/sample -t fraud-api .
          docker run -d -p 8000:8000 --name api fraud-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sS --fail-with-body -X POST localhost:8000/score -H "Content-Type: application/json" -d @api/example_request.json || { docker logs api; exit 1; }
          docker logs api
